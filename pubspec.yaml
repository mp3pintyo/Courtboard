name: courtboard

description: Sportolókövető asztali alkalmazás Flutterhez.
publish_to: none
version: 0.15.1+17

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  drift: ^2.35.0
  ffi: ^2.2.0
  file_selector: ^1.1.0
  fl_chart: 1.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.2
  html: ^0.15.6
  intl: ^0.20.2
  package_info_plus: ^10.2.1
  sqlite3: ^3.5.0
  tray_manager: ^0.5.3
  url_launcher: ^6.3.2
  win32: ^6.4.0
  window_manager: ^0.5.2
  xml: ^6.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # A hírarchívum drift-kódjának generálása (lásd build.yaml).
  build_runner: ^2.15.1
  drift_dev: ^2.35.0
  fake_async: ^1.3.3
  flutter_lints: ^5.0.0
  msix: ^3.18.0

flutter:
  uses-material-design: true
  assets:
    # A tálcaikon (a tray_manager a flutter_assets mappából tölti be).
    - assets/tray/app_icon.ico

# MSIX csomag (`dart run msix:create`, lásd tool/build_msix.ps1 és README).
# Aláíró tanúsítvány nélkül a msix csomag saját teszttanúsítványával ír alá;
# a tanúsítványt SEM a build, SEM a script nem telepíti.
msix_config:
  display_name: Courtboard
  publisher_display_name: Mp3Pintyo
  identity_name: Mp3Pintyo.Courtboard
  msix_version: 0.15.1.0
  logo_path: windows/runner/resources/app_icon.ico
  capabilities: internetClient
  languages: hu-hu, en-us
  store: false
  install_certificate: false
  build_windows: false
  # Értesítésre kattintás (a bezárt app indítása is): ugyanaz a GUID, mint a
  # CourtboardToastIdentity.activatorGuid (lib/desktop/windows_notifications.dart).
  toast_activator:
    clsid: 2d8668a6-7c36-481c-99dd-25e4a414dc60
    arguments: -ToastActivated
    display_name: Courtboard
